name: Build and check
'on':
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install opentelemetry-sdk==1.44.0
      - run: python -m unittest discover -s evals/tests/backend
        env:
          PYTHONPATH: .:backend:evals/archive/experiments:backend/app/infrastructure/models
      - run: python -m unittest discover -s evals/tests/experiments -p "test_*.py"
        env:
          PYTHONPATH: .:backend:evals/archive/experiments:backend/app/infrastructure/models
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: |
          curl --fail http://127.0.0.1:8080/ > /dev/null
          curl --fail http://127.0.0.1:8080/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ready)" = "503"
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
